name = "w2r-stats"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# Served only from its own subdomain; saweet.net and www are other projects and stay untouched.
workers_dev = false
routes = [{ pattern = "w2r-stats.saweet.net", custom_domain = true }]

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "w2r_stats"
database_name = "w2r-stats"
database_id = "a2fdff76-c745-47a2-a7b5-60a2a8bf17a0"

# Replay files, keyed by the SHA-256 of the file. The `replays` table in D1 holds the metadata.
[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "w2r-replays"

# Group and judge new reports every five minutes; rebuild every rating once a night.
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

# Requests per address per minute: uploads (reports and replays) and reads are limited apart.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
