[package]
name = "w2rpm-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "w2rpm-gui: desktop plugin manager for Warcraft II Remastered"

[[bin]]
name = "w2rpm-gui"
path = "src/main.rs"

[dependencies]
w2rpm-lib = { path = "../w2rpm-lib" }
w2r-formats.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
w2rpm-lib = { path = "../w2rpm-lib", features = ["dev-sign"] }
