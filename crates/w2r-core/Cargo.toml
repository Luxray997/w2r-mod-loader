[package]
name = "w2r-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "In-game plugin host for Warcraft II Remastered (32-bit cdylib, version.dll proxy)"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
w2r-abi.workspace = true
# DLL pins, peer tags and the simulation fingerprint.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Structured exception handling around every call into a plugin. See src/guard.rs for why.
microseh = "1.2"
# Inline hooks (bundled MinHook, BSD-2). See src/hooks.rs.
minhook-sys = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
