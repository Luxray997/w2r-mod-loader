[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
w2r-abi = { path = "crates/w2r-abi" }
w2r-formats = { path = "crates/w2r-formats" }
w2r-preview = { path = "crates/w2r-preview" }
w2r-replay = { path = "crates/w2r-replay" }
w2r-stats = { path = "crates/w2r-stats" }
